version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - AIRTRACK_DEMO_MODE=true
      - DATABASE_URL=sqlite:///./airtrack.db
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
